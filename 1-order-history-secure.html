<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>היסטוריית הזמנות מאובטחת</title><style>:root{--ink:#18352d;--paper:#f5f0e4;--card:#fffdf7;--lime:#dbea83;--orange:#f19752;--red:#bd4b3f;--line:#d9d2c1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,calc(100% - 20px));margin:auto;padding:24px 0 50px}h1{font-size:clamp(34px,8vw,60px);margin:8px 0}.back{color:var(--ink);font-weight:800}.gate{background:var(--card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--orange);padding:20px;margin:25px 0}.gate input,.gate button,.filters select,.filters input{font:inherit;padding:10px;border:1px solid var(--ink);background:white}.gate button{background:var(--lime);font-weight:900}.err{color:var(--red);font-weight:800}.filters{position:sticky;top:0;background:var(--paper);display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;z-index:3}.store{margin:18px 0}.store h2{border-bottom:3px solid var(--orange);padding-bottom:7px}.order{background:var(--card);border:1px solid var(--ink);margin:8px 0}.order summary{cursor:pointer;padding:13px;font-weight:900;display:flex;justify-content:space-between;gap:10px}.order[open] summary{background:var(--lime)}.lines{padding:0 12px 10px}.line{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding:9px 0}.price{white-space:nowrap;font-weight:800}.muted{font-size:12px;color:#65736c}.empty{padding:30px;text-align:center}.trend{background:var(--card);border:1px solid var(--ink);padding:12px;margin:10px 0}.trend svg{width:100%;height:130px;overflow:visible}.trendline{fill:none;stroke-width:3}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.purchases{max-height:230px;overflow:auto}.purchase{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0}@media(max-width:520px){.line{grid-template-columns:1fr}.filters>*{width:100%}}</style><div class="wrap"><a class="back" href="./">← חזרה להשוואת המחירים</a><h1>היסטוריית הזמנות</h1><div id="gate" class="gate"><p><b>ההיסטוריה מוצפנת.</b> הסיסמה נשארת במכשיר ולא נשלחת לשרת.</p><input id="password" type="password" autocomplete="current-password" placeholder="סיסמה"><button id="unlock" type="button" aria-label="כניסה להיסטוריית הזמנות">כניסה להיסטוריה</button><p id="err" class="err"></p></div><div id="app" hidden><p>מחירים ששולמו בפועל. ללא שמות, כתובות, טלפונים, אימייל, תשלום או משלוח.</p><section class="gate"><h2>מחיר מוצר לאורך זמן</h2><input id="productSearch" placeholder="חיפוש מוצר שקנית…" aria-label="חיפוש מוצר"><div id="trends" class="muted">הקלידו לפחות 2 תווים.</div></section><div class="filters"><select id="store"><option value="">כל החנויות</option><option value="lipsker">ליפסקר</option><option value="sholik">שוליק</option><option value="mishnat_yosef">משנת יוסף</option></select><input id="from" type="date" aria-label="מתאריך"><input id="to" type="date" aria-label="עד תאריך"></div><div id="root"></div></div></div><script>const names={lipsker:'ליפסקר',sholik:'שוליק',mishnat_yosef:'משנת יוסף'};let D;const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function openHistory(){err.textContent='';try{let x=await fetch('2-order-history.enc.json').then(r=>r.json()),keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(x.salt),iterations:x.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(x.iv)},key,b64(x.ciphertext));D=JSON.parse(new TextDecoder().decode(plain));gate.hidden=true;app.hidden=false;password.value='';render()}catch(_){err.textContent='הסיסמה שגויה או שהקובץ פגום.'}}function render(){let sf=store.value,f=from.value,t=to.value,html='';for(const [key,s] of Object.entries(D.stores)){if(sf&&sf!==key)continue;let os=s.orders.filter(o=>(!f||o.date>=f)&&(!t||o.date<=t)).sort((a,b)=>b.date.localeCompare(a.date));if(!os.length)continue;html+=`<section class="store"><h2>${names[key]} · ${os.length} הזמנות</h2>`+os.map(o=>`<details class="order"><summary><span>${e(o.date.split('-').reverse().join('.'))}</span><span>${o.order_total!=null?'₪'+Number(o.order_total).toFixed(2):''} · ${o.items.length} שורות</span></summary><div class="lines">${o.items.map(x=>`<div class="line"><div><b>${e(x.name)}</b><div class="muted">כמות ${e(x.quantity)}${x.package_amount!=null?' · אריזה '+e(x.package_amount):''}</div></div><div class="price">₪${Number(x.line_total).toFixed(2)}<div class="muted">₪${Number(x.unit_price).toFixed(2)} ליחידה</div></div></div>`).join('')}</div></details>`).join('')+'</section>'}root.innerHTML=html||'<div class="empty">לא נמצאו הזמנות בטווח הזה.</div>'}function trend(){let q=productSearch.value.trim().toLowerCase();if(q.length<2){trends.textContent='הקלידו לפחות 2 תווים.';return}let pts=[];for(const [st,s] of Object.entries(D.stores))for(const o of s.orders)for(const x of o.items)if(x.name.toLowerCase().includes(q))pts.push({st,date:o.date,price:+x.unit_price,name:x.name});pts.sort((a,b)=>a.date.localeCompare(b.date));if(!pts.length){trends.innerHTML='<div class="empty">לא נמצאו רכישות.</div>';return}let by={};for(const x of pts)(by[x.st]??=[]).push(x);let all=pts.map(x=>x.price),min=Math.min(...all),max=Math.max(...all),dates=[...new Set(pts.map(x=>x.date))].sort(),colors={lipsker:'#bd4b3f',sholik:'#287271',mishnat_yosef:'#7951a8'},paths=Object.entries(by).map(([st,a])=>{let p=a.map(x=>{let ix=dates.indexOf(x.date),xx=dates.length===1?300:20+ix/(dates.length-1)*560,yy=max===min?65:115-(x.price-min)/(max-min)*100;return `${xx},${yy}`}).join(' ');return `<polyline class="trendline" stroke="${colors[st]}" points="${p}"/>`}).join('');let legend=Object.keys(by).map(st=>`<span style="color:${colors[st]}">● ${names[st]}</span>`).join('');trends.innerHTML=`<div class="trend"><b>${e(pts[0].name)}</b><div class="legend">${legend}</div><svg viewBox="0 0 600 130" role="img" aria-label="מחיר לאורך זמן">${paths}</svg><div class="purchases">${pts.slice().reverse().map(x=>`<div class="purchase"><span>${e(x.date.split('-').reverse().join('.'))} · ${names[x.st]}</span><b>₪${x.price.toFixed(2)}</b></div>`).join('')}</div></div>`}unlock.onclick=openHistory;password.onkeydown=x=>{if(x.key==='Enter')openHistory()};productSearch.oninput=trend;for(const x of [store,from,to])x.onchange=render;</script></html>
