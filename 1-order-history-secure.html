<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>היסטוריית הזמנות מאובטחת</title><style>:root{--ink:#18352d;--paper:#f5f0e4;--card:#fffdf7;--lime:#dbea83;--orange:#f19752;--red:#bd4b3f;--line:#d9d2c1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,calc(100% - 20px));margin:auto;padding:24px 0 50px}h1{font-size:clamp(34px,8vw,60px);margin:8px 0}.back{color:var(--ink);font-weight:800}.gate{background:var(--card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--orange);padding:20px;margin:25px 0}.gate input,.gate button,.filters select,.filters input{font:inherit;padding:10px;border:1px solid var(--ink);background:white}.gate button{background:var(--lime);font-weight:900}.err{color:var(--red);font-weight:800}.filters{position:sticky;top:0;background:var(--paper);display:flex;gap:8px;flex-wrap:wrap;padding:10px 0;z-index:3}.store{margin:18px 0}.store h2{border-bottom:3px solid var(--orange);padding-bottom:7px}.order{background:var(--card);border:1px solid var(--ink);margin:8px 0}.order summary{cursor:pointer;padding:13px;font-weight:900;display:flex;justify-content:space-between;gap:10px}.order[open] summary{background:var(--lime)}.lines{padding:0 12px 10px}.line{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding:9px 0}.price{white-space:nowrap;font-weight:800}.muted{font-size:12px;color:#65736c}.empty{padding:30px;text-align:center}@media(max-width:520px){.line{grid-template-columns:1fr}.filters>*{width:100%}}</style><div class="wrap"><a class="back" href="./">← חזרה להשוואת המחירים</a><h1>היסטוריית הזמנות</h1><div id="gate" class="gate"><p><b>ההיסטוריה מוצפנת.</b> הסיסמה נשארת במכשיר ולא נשלחת לשרת.</p><input id="password" type="password" autocomplete="current-password" placeholder="סיסמה"><button id="unlock">פתיחה</button><p id="err" class="err"></p></div><div id="app" hidden><p>מחירים ששולמו בפועל. ללא שמות, כתובות, טלפונים, אימייל, תשלום או משלוח.</p><div class="filters"><select id="store"><option value="">כל החנויות</option><option value="lipsker">ליפסקר</option><option value="sholik">שוליק</option><option value="mishnat_yosef">משנת יוסף</option></select><input id="from" type="date" aria-label="מתאריך"><input id="to" type="date" aria-label="עד תאריך"></div><div id="root"></div></div></div><script>const names={lipsker:'ליפסקר',sholik:'שוליק',mishnat_yosef:'משנת יוסף'};let D;const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function openHistory(){err.textContent='';try{let x=await fetch('2-order-history.enc.json').then(r=>r.json()),keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(x.salt),iterations:x.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(x.iv)},key,b64(x.ciphertext));D=JSON.parse(new TextDecoder().decode(plain));gate.hidden=true;app.hidden=false;password.value='';render()}catch(_){err.textContent='הסיסמה שגויה או שהקובץ פגום.'}}function render(){let sf=store.value,f=from.value,t=to.value,html='';for(const [key,s] of Object.entries(D.stores)){if(sf&&sf!==key)continue;let os=s.orders.filter(o=>(!f||o.date>=f)&&(!t||o.date<=t)).sort((a,b)=>b.date.localeCompare(a.date));if(!os.length)continue;html+=`<section class="store"><h2>${names[key]} · ${os.length} הזמנות</h2>`+os.map(o=>`<details class="order"><summary><span>${e(o.date.split('-').reverse().join('.'))}</span><span>${o.order_total!=null?'₪'+Number(o.order_total).toFixed(2):''} · ${o.items.length} שורות</span></summary><div class="lines">${o.items.map(x=>`<div class="line"><div><b>${e(x.name)}</b><div class="muted">כמות ${e(x.quantity)}${x.package_amount!=null?' · אריזה '+e(x.package_amount):''}</div></div><div class="price">₪${Number(x.line_total).toFixed(2)}<div class="muted">₪${Number(x.unit_price).toFixed(2)} ליחידה</div></div></div>`).join('')}</div></details>`).join('')+'</section>'}root.innerHTML=html||'<div class="empty">לא נמצאו הזמנות בטווח הזה.</div>'}unlock.onclick=openHistory;password.onkeydown=x=>{if(x.key==='Enter')openHistory()};for(const x of [store,from,to])x.onchange=render;</script></html>
